behaviors:
    Walker:
        trainer_type: ppo
        hyperparameters:
            batch_size: 2048
            buffer_size: 20480
            learning_rate: 0.0003
            beta: 0.005
            epsilon: 0.2
            lambd: 0.95
            num_epoch: 3
            learning_rate_schedule: linear
        network_settings:
            normalize: true # CRITICAL: Normalizes the wild ranges of 39 different joint angles
            hidden_units: 512 # A massive brain to handle the complexity
            num_layers: 3 # Deep layers for complex motor control
        reward_signals:
            extrinsic:
                gamma: 0.995
                strength: 1.0
        keep_checkpoints: 5
        max_steps: 15000000 # 15 Million steps (Walking is hard!)
        time_horizon: 1000
        summary_freq: 50000
