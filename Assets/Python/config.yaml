behaviors:
    Walker:
        trainer_type: ppo
        hyperparameters:
            batch_size: 2048
            buffer_size: 20480
            learning_rate: 0.0003
            beta: 0.005
            epsilon: 0.2
            lambd: 0.95
            num_epoch: 3
            learning_rate_schedule: linear
        network_settings:
            normalize: true # CRITICAL: Normalizes the wild ranges of 39 different joint angles
            hidden_units: 512 # A massive brain to handle the complexity
            num_layers: 3 # Deep layers for complex motor control
        reward_signals:
            extrinsic:
                gamma: 0.995
                strength: 1.0
        keep_checkpoints: 5
        max_steps: 15000000 # 15 Million steps (Walking is hard!)
        time_horizon: 1000
        summary_freq: 50000
# Stage 2 recovery curriculum. Recovering from fully prone (~90 deg) is a long, precise action
# sequence that random exploration essentially never discovers - the reward on the way up is
# ~0.035/step against 0.3-1.0/step for walking, so there is nothing to climb. Starting shallow
# gives the walking policy a stumble it can already half-correct, then the tilt deepens as it
# improves. Read by WalkerAgent via Academy EnvironmentParameters; falls back to the Inspector's
# fallenStartTilt when running without a curriculum.
environment_parameters:
    fallen_tilt:
        curriculum:
            - name: Stumble # shallow lean, recoverable with the balance it already has
              completion_criteria:
                  measure: reward
                  behavior: Walker
                  signal_smoothing: true
                  min_lesson_length: 100
                  threshold: 1100
              value: 30
            - name: Toppled # genuinely down, but not flat
              completion_criteria:
                  measure: reward
                  behavior: Walker
                  signal_smoothing: true
                  min_lesson_length: 100
                  threshold: 1100
              value: 60
            - name: Prone # the original 90-degree case
              value: 90
engine_settings:
    # Simulated seconds per real second. Measured from Walker_timers.json: 450,013 physics
    # steps in 1,625 s = 277/sec, and at fixedDeltaTime 0.02 that is an *effective* 5.5x.
    # time_scale 20 was requesting 1000 steps/sec, ~4x more than the machine can deliver, and
    # Unity spends the difference perpetually trying to catch up - which is what makes the
    # Editor unresponsive. 8 leaves headroom above the achieved rate without the thrash.
    # Raising this cannot beat the Unity<->Python round trip; see the README Todo on --num-envs.
    time_scale: 8
    quality_level: 0 # lowest render quality preset - no effect on physics/training, just cuts render cost
    width: 84
    height: 84 # tiny Game view resolution - you're not watching this closely during bulk training
    no_graphics: false # only takes effect against a standalone build, not Editor Play mode
