behaviors:
    Walker:
        trainer_type: ppo
        hyperparameters:
            batch_size: 2048
            buffer_size: 20480
            learning_rate: 0.0003
            beta: 0.005
            epsilon: 0.2
            lambd: 0.95
            num_epoch: 3
            learning_rate_schedule: linear
        network_settings:
            normalize: true # CRITICAL: Normalizes the wild ranges of 39 different joint angles
            hidden_units: 512 # A massive brain to handle the complexity
            num_layers: 3 # Deep layers for complex motor control
        reward_signals:
            extrinsic:
                gamma: 0.995
                strength: 1.0
        keep_checkpoints: 5
        max_steps: 20000000 # ~4 h on this machine at the measured ~1,450 steps/sec.
                            #
                            # This is a schedule, not just a budget: it drives the linear LR decay AND
                            # the `progress` measure the curriculum below is gated on. A run that
                            # reaches it is finished in both senses - `--resume` exits immediately and
                            # the LR has decayed to zero - so continuing past it means a NEW run-id
                            # seeded with `--initialize-from`, which restarts step 0 and hence both
                            # schedules. Walker_GetupOnly hit this at 20,000,548.
        time_horizon: 1000
        summary_freq: 50000
# GET-UP ONLY. A decisive test of whether recovery is learnable from this reward at all.
# Every episode starts near-prone (80-90 deg) - no walking starts, no balance perturbations - so
# 100% of experience is get-up practice, against ~15% under the graduated curriculum. Pair with
# fallenStartProbability = 1.0 on the ragdoll prefab.
#
# Decision rule: if a few million steps of this produce no recovery, the behaviour is not reachable
# by exploration from this reward, and the answer is demonstrations (BC/GAIL over a scripted get-up),
# not further curriculum tuning.
#
# ANSWERED, at 20M steps: recovery IS reachable. The ragdoll reliably rises from prone to a stable
# kneel (mean reward 954, episode length ~838 against a no-recovery floor of 120). No demonstrations
# needed. The remaining problem is not "can't get up", it is "stops halfway" - see collapse_posture.
environment_parameters:
    # Reverse curriculum on the start pose - teach the LAST part of the get-up first.
    #
    # Walker_Getup3 showed the flat-90 start is an exploration dead end. Seeded from the 20M
    # kneeler with the target switched off, posture sat at 0.511-0.523 and entropy at 0.671-0.672
    # for 300k steps: not slow learning, a converged policy with no gradient it can act on. Level
    # reward already pays ~2x more for standing than kneeling, so the incentive is not missing.
    # What is missing is that this policy has NEVER BEEN UPRIGHT, so nothing in its experience
    # tells it what upright feels like or how to hold it.
    #
    # Undirected exploration cannot fix that - raising beta injects noise into 39 joint targets,
    # and no amount of that noise produces a coordinated rise. Structured exploration can: start
    # the episode in states the policy cannot reach on its own. Lesson 0 starts it near-upright,
    # where the whole task is "don't collapse to the kneel", and the tilt then ramps backward
    # until the start is prone again.
    #
    # This is the curriculum GetupOnly deleted, restored. It failed the first time because walking
    # diluted it to ~15% get-up practice - and posture_focus below is precisely what removes that
    # dilution. The reason it failed is gone, so the idea is worth having back.
    #
    # min trails max by a wide margin so every lesson spans a RANGE. Lesson 3 is [60,90], not
    # [80,90], so the easier poses stay in the data and balance isn't forgotten while prone is
    # relearned.
    fallen_tilt:
        curriculum:
            - name: Balance # [0,30] - essentially a standing start. Learn to hold it.
              completion_criteria: &tilt_0
                  measure: progress
                  behavior: Walker
                  signal_smoothing: true
                  min_lesson_length: 500
                  threshold: 0.15
              value: 30
            - name: Stumble # [15,55] - recover a lean without going down
              completion_criteria: &tilt_1
                  measure: progress
                  behavior: Walker
                  signal_smoothing: true
                  min_lesson_length: 500
                  threshold: 0.35
              value: 55
            - name: Toppled # [35,78] - past the point where posture drops under the collapse bar
              completion_criteria: &tilt_2
                  measure: progress
                  behavior: Walker
                  signal_smoothing: true
                  min_lesson_length: 500
                  threshold: 0.55
              value: 78
            - name: Prone # [60,90] - the full get-up, which is where GetupOnly started
              value: 90
    # Anchors reused so the two ramps advance on the same schedule and can't drift apart silently.
    fallen_tilt_min:
        curriculum:
            - name: Balance
              completion_criteria: *tilt_0
              value: 0
            - name: Stumble
              completion_criteria: *tilt_1
              value: 15
            - name: Toppled
              completion_criteria: *tilt_2
              value: 35
            - name: Prone
              value: 60
    # Switch the target off. Posture is the entire reward here; there is nothing to earn by moving.
    #
    # Isolating the start state (fallen_tilt above) made recovery learnable, but it left the
    # OBJECTIVE mixed and the target kept paying. Decomposing Walker_GetupOnly's final mean reward
    # of 954 over ~4,190 physics steps per episode:
    #
    #   locomotion  0.170/step   74%   <- earned at ~1.8 m/s, on its knees
    #   posture     0.052/step   23%
    #   shaping     0.006/step    3%
    #
    # Gating locomotion by posture is not the same as not paying for it: a kneeler keeps 52% of a
    # large term, which beats 100% of a small one. Standing and walking scores ~4x more per step,
    # so this is not an inverted reward - but the rise costs all of that income up front, and the
    # cheapest way to stay paid is to keep crawling. Same lesson as the start state, one level in.
    #
    # Left flat at 1.0: the target comes back when this policy is folded into the walking
    # curriculum via --initialize-from, not partway through the get-up run.
    posture_focus: 1.0
    # The bar the ragdoll has to clear to reset its collapse timer, ratcheted upward.
    #
    # MEASURED, over 20M steps of the un-ramped kneeling policy: Walker/Posture settles around
    # 0.52 and was still climbing slowly. Standing is 1.0 by construction (m_StandingHeight is
    # calibrated from the ragdoll's own pose at Initialize), so 0.52 is a torso held vertical but
    # folded down onto the shins - the kneel, exactly as observed in playback.
    #
    # Why a RAMP and not the single measured number. 0.52 is an episode-mean over every physics
    # step, and every episode opens with 2-3 s prone at posture ~0. So 0.52 is a lower bound on
    # the pose actually held once standing-ish: if the transient is a quarter of the episode, the
    # held pose is nearer 0.66. The histogram cannot separate the two, and the two imply different
    # thresholds. A ratchet does not need them separated - it walks the bar up through both
    # readings and bites wherever the real ceiling turns out to be. Watch which lesson is the one
    # where episode length drops; that step is the true ceiling, and it is worth writing down.
    #
    # NOTE ON PROGRESS: measure `progress` is current_step / max_steps, so these thresholds only
    # mean what they say on a run that STARTS at step 0. `--initialize-from` does that (it seeds
    # weights but resets the counter); `--resume` does not, and would drop straight into whichever
    # lesson matches the resumed step. Lesson 0 is unchanged at 0.2 so the first 2M steps
    # re-stabilise the seeded policy under the new terminal cut before the bar moves at all -
    # otherwise a regression is unattributable between the two changes.
    collapse_posture:
        curriculum:
            - name: Kneel # 0.2, unchanged. A kneel clears this forever; that is the bug.
              completion_criteria:
                  measure: progress
                  behavior: Walker
                  signal_smoothing: true
                  min_lesson_length: 500
                  threshold: 0.10
              value: 0.2
            - name: GoodKneel # a sloppy half-collapsed kneel stops counting; a clean upright one still does
              completion_criteria:
                  measure: progress
                  behavior: Walker
                  signal_smoothing: true
                  min_lesson_length: 500
                  threshold: 0.25
              value: 0.35
            - name: AtCeiling # right at the measured mean - marginal even for a good kneel
              completion_criteria:
                  measure: progress
                  behavior: Walker
                  signal_smoothing: true
                  min_lesson_length: 500
                  threshold: 0.45
              value: 0.5
            - name: PastKneel # above any kneel: has to come up off the shins onto the feet
              completion_criteria:
                  measure: progress
                  behavior: Walker
                  signal_smoothing: true
                  min_lesson_length: 500
                  threshold: 0.65
              value: 0.6
            - name: Stand # a real stand, with slack for lean and bent knees. Not 1.0: nothing holds 1.0.
              value: 0.7
engine_settings:
    # Simulated seconds per real second. Measured from Walker_timers.json: 450,013 physics
    # steps in 1,625 s = 277/sec, and at fixedDeltaTime 0.02 that is an *effective* 5.5x.
    # time_scale 20 was requesting 1000 steps/sec, ~4x more than the machine can deliver, and
    # Unity spends the difference perpetually trying to catch up - which is what makes the
    # Editor unresponsive. 8 leaves headroom above the achieved rate without the thrash.
    # Raising this cannot beat the Unity<->Python round trip; see the README Todo on --num-envs.
    time_scale: 8
    quality_level: 0 # lowest render quality preset - no effect on physics/training, just cuts render cost
    width: 84
    height: 84 # tiny Game view resolution - you're not watching this closely during bulk training
    no_graphics: false # only takes effect against a standalone build, not Editor Play mode
