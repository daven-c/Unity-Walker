behaviors:
    Walker:
        trainer_type: ppo
        hyperparameters:
            batch_size: 2048
            buffer_size: 20480
            # 1e-4, not the 3e-4 used for from-scratch runs. This config only ever runs as a
            # fine-tune of an existing policy, and Getup6 showed how fast a full-strength LR
            # erases a seeded skill when the buffer is mostly failure: Stage1's standing was
            # gone inside 100k steps. Lower LR trades adaptation speed for keeping the thing
            # the seed was chosen for.
            learning_rate: 0.0001
            beta: 0.005
            epsilon: 0.2
            lambd: 0.95
            num_epoch: 3
            learning_rate_schedule: linear
        network_settings:
            normalize: true # CRITICAL: Normalizes the wild ranges of 39 different joint angles
            hidden_units: 512 # A massive brain to handle the complexity
            num_layers: 3 # Deep layers for complex motor control
        reward_signals:
            extrinsic:
                gamma: 0.995
                strength: 1.0
        keep_checkpoints: 5
        # 12M, ~2.3 h at the measured ~1,450 steps/sec. Set to the length actually intended, not
        # a generous ceiling: `progress` is step/max_steps, so max_steps IS the curriculum's clock.
        # A 20M ceiling on a run stopped at 1M is why the collapse ratchet never fired for four
        # runs. At 12M the first lesson ends at exactly 2.0M, which is E1's evaluation point.
        #
        # A run that reaches this is finished in both senses - `--resume` exits immediately and the
        # linear LR has decayed to zero - so continuing means a new run-id seeded with
        # --initialize-from, which restarts step 0 and hence both schedules.
        max_steps: 12000000
        time_horizon: 1000
        summary_freq: 50000
# GET-UP ONLY. A decisive test of whether recovery is learnable from this reward at all.
# Every episode starts near-prone (80-90 deg) - no walking starts, no balance perturbations - so
# 100% of experience is get-up practice, against ~15% under the graduated curriculum. Pair with
# fallenStartProbability = 1.0 on the ragdoll prefab.
#
# Decision rule: if a few million steps of this produce no recovery, the behaviour is not reachable
# by exploration from this reward, and the answer is demonstrations (BC/GAIL over a scripted get-up),
# not further curriculum tuning.
#
# ANSWERED, at 20M steps: recovery IS reachable. The ragdoll reliably rises from prone to a stable
# kneel (mean reward 954, episode length ~838 against a no-recovery floor of 120). No demonstrations
# needed. The remaining problem is not "can't get up", it is "stops halfway" - see collapse_posture.
environment_parameters:
    # Reverse curriculum on start tilt, EASY END PINNED AT 0, lesson boundaries SET FROM E0.
    #
    # E0 (Probe_Stage1b, EXPERIMENT.md) swept a frozen Stage1 across fixed tilts and measured the
    # recovery frontier for the first time instead of guessing it:
    #
    #     tilt      0     10     20     30     45     60     90
    #     upright  .82    .73    .40    .03    .02    .00    .00
    #     peak    1.00    .99    .98    .91    .80    .56    .31
    #
    # TimeUpright holds above 0.5 to about 15 degrees and falls off a cliff between 20 and 30.
    # That is the whole competence of a policy trained for 15M steps with falling terminal: it can
    # recover a 15-degree lean and nothing more, because it was never once allowed to be past that.
    #
    # Every tilt curriculum before this one stepped straight over the cliff. The last version went
    # [0,15] -> [0,35] in one lesson, crossing the entire 20-30 collapse in a single move. The
    # lessons below put four steps inside the region where the frontier actually is.
    #
    # peak > cos(pitch) at every tilt, so it does partially right itself before going down - the
    # rising motion exists, it just does not finish. That is the thing being extended.
    fallen_tilt:
        curriculum:
            - name: Lean # inside the measured frontier: upright .82 -> .73. Should barely fall.
              completion_criteria: &prog
                  measure: progress
                  behavior: Walker
                  signal_smoothing: true
                  min_lesson_length: 200
                  threshold: 0.167
              value: 15
            - name: Tip # frontier edge, upright .40 at fixed 20. First lesson that asks for new skill.
              completion_criteria:
                  <<: *prog
                  threshold: 0.30
              value: 22
            - name: Stumble # into the cliff - upright .03 at fixed 30
              completion_criteria:
                  <<: *prog
                  threshold: 0.45
              value: 30
            - name: Topple # past it
              completion_criteria:
                  <<: *prog
                  threshold: 0.62
              value: 45
            - name: Fall
              completion_criteria:
                  <<: *prog
                  threshold: 0.80
              value: 65
            - name: Prone # the full get-up, with the easy end still in every batch
              value: 90
    # Pinned at 0 for the whole run, so near-upright starts never leave the data and the standing
    # skill is rehearsed continuously. The first reverse curriculum ramped this up to 60 and
    # stopped practising the very thing it had just taught.
    fallen_tilt_min: 0
    # Switch the target off. Posture is the entire reward here; there is nothing to earn by moving.
    #
    # Isolating the start state (fallen_tilt above) made recovery learnable, but it left the
    # OBJECTIVE mixed and the target kept paying. Decomposing Walker_GetupOnly's final mean reward
    # of 954 over ~4,190 physics steps per episode:
    #
    #   locomotion  0.170/step   74%   <- earned at ~1.8 m/s, on its knees
    #   posture     0.052/step   23%
    #   shaping     0.006/step    3%
    #
    # Gating locomotion by posture is not the same as not paying for it: a kneeler keeps 52% of a
    # large term, which beats 100% of a small one. Standing and walking scores ~4x more per step,
    # so this is not an inverted reward - but the rise costs all of that income up front, and the
    # cheapest way to stay paid is to keep crawling. Same lesson as the start state, one level in.
    #
    # Left flat at 1.0: the target comes back when this policy is folded into the walking
    # curriculum via --initialize-from, not partway through the get-up run.
    posture_focus: 1.0
    # The bar the ragdoll has to clear to reset its collapse timer, ratcheted upward.
    #
    # MEASURED, over 20M steps of the un-ramped kneeling policy: Walker/Posture settles around
    # 0.52 and was still climbing slowly. Standing is 1.0 by construction (m_StandingHeight is
    # calibrated from the ragdoll's own pose at Initialize), so 0.52 is a torso held vertical but
    # folded down onto the shins - the kneel, exactly as observed in playback.
    #
    # Why a RAMP and not the single measured number. 0.52 is an episode-mean over every physics
    # step, and every episode opens with 2-3 s prone at posture ~0. So 0.52 is a lower bound on
    # the pose actually held once standing-ish: if the transient is a quarter of the episode, the
    # held pose is nearer 0.66. The histogram cannot separate the two, and the two imply different
    # thresholds. A ratchet does not need them separated - it walks the bar up through both
    # readings and bites wherever the real ceiling turns out to be. Watch which lesson is the one
    # where episode length drops; that step is the true ceiling, and it is worth writing down.
    #
    # NOTE ON PROGRESS: measure `progress` is current_step / max_steps, so these thresholds only
    # mean what they say on a run that STARTS at step 0. `--initialize-from` does that (it seeds
    # weights but resets the counter); `--resume` does not, and would drop straight into whichever
    # lesson matches the resumed step. Lesson 0 is unchanged at 0.2 so the first 2M steps
    # re-stabilise the seeded policy under the new terminal cut before the bar moves at all -
    # otherwise a regression is unattributable between the two changes.
    # The bar posture must clear to reset the collapse timer. RATCHETS FAST, and that is the fix.
    #
    # This ramp used to run 0.2 -> 0.35 -> 0.5 -> 0.6 -> 0.7 over progress 0.10/0.25/0.45/0.65 of a
    # 20M-step run. It never once fired. Every run so far was stopped or restarted well inside
    # lesson 0 - Getup3 died at 300k, Getup4 was still at 1.35M - and --initialize-from resets
    # progress to 0, so lesson 0 replayed from scratch every time. Four runs, ~22M steps, and the
    # mechanism built to make kneeling fatal spent all of it inert at 0.2, which a kneel clears
    # forever. The thresholds were written for one uninterrupted 20M run; the actual workflow is
    # restarts every ~1M steps. Design for the workflow you have.
    #
    # Why termination is the strong lever here, and per-step reward is not. Kneeling scores 0.52
    # per step and standing ~0.9, which sounds like a 1.7x preference - but ONLY because a kneeler
    # survives just as long as a stander, so per-step and per-episode ratios are identical. Make
    # the kneel terminal and the comparison changes shape entirely:
    #
    #   kneel, cut at 600 physics steps   600 x 0.52  =   312
    #   stand, survives to MaxStep       4995 x 0.90  = 4,495   ->  ~14x, not 1.7x
    #
    # A termination condition moves total return by an order of magnitude more than a reward
    # coefficient can, which is the same lesson as "termination conditions are part of the reward
    # function" from the worm-gait era, pointed the other way.
    #
    # Two lessons, not five, and the first is 500k steps rather than 2M. 0.45 clears a clean kneel
    # but not a slumped crawl, so there is pressure from the start; 0.65 clears no kneel at all.
    # With tilt uniform over [0,90], ~a third of episodes already start above 0.65, and those carry
    # the signal that matters most: you began upright, and collapsing now ends the episode.
    collapse_posture:
        curriculum:
            - name: Rise # a clean kneel clears it, a slumped crawl does not
              completion_criteria:
                  measure: progress
                  behavior: Walker
                  signal_smoothing: true
                  min_lesson_length: 100
                  threshold: 0.025
              value: 0.45
            - name: Stand # no kneel clears this. Slack left below 0.7 for lean and bent knees.
              value: 0.65
engine_settings:
    # Simulated seconds per real second. Measured from Walker_timers.json: 450,013 physics
    # steps in 1,625 s = 277/sec, and at fixedDeltaTime 0.02 that is an *effective* 5.5x.
    # time_scale 20 was requesting 1000 steps/sec, ~4x more than the machine can deliver, and
    # Unity spends the difference perpetually trying to catch up - which is what makes the
    # Editor unresponsive. 8 leaves headroom above the achieved rate without the thrash.
    # Raising this cannot beat the Unity<->Python round trip; see the README Todo on --num-envs.
    time_scale: 8
    quality_level: 0 # lowest render quality preset - no effect on physics/training, just cuts render cost
    width: 84
    height: 84 # tiny Game view resolution - you're not watching this closely during bulk training
    no_graphics: false # only takes effect against a standalone build, not Editor Play mode
